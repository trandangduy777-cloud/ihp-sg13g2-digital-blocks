  name: sim
  on:
    push:
    pull_request:
  jobs:
    simulate:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Install Icarus Verilog
          run: sudo apt-get update && sudo apt-get install -y iverilog
        - name: Run self-checking testbenches
          run: bash unic-cass-advanced/run_sim.sh
